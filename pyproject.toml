[project]
name = "directory-scraper"
version = "1.0.0"
description = "Turn public business directories into clean, deduplicated leads spreadsheets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
directory-scraper = "directory_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["directory_scraper*"]
